<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Our Menu</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    height: 100vh; height: 100dvh; background: #14171A; color: #EDEAE2;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  .screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .center-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px; text-align: center; }
  .center-screen .emoji { font-size: 56px; margin-bottom: 18px; }
  .center-screen h1 { font-size: 22px; margin-bottom: 10px; }
  .center-screen p { color: #8a8f96; font-size: 15px; line-height: 1.5; max-width: 340px; }

  .order-header {
    padding: 14px 18px; display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid #2a2e33;
  }
  .order-header .title { font-size: 17px; font-weight: 700; }
  .order-header .sub { font-size: 12px; color: #8a8f96; margin-top: 2px; }
  .lang-toggle {
    background: #1c2024; border: 1px solid #2a2e33; color: #EDEAE2; padding: 8px 14px;
    border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; flex: 0 0 auto;
  }

  /* ---------- Promo banner (per-category, 3 selectable templates) ---------- */
  .ad-wrap { position: relative; margin: 14px 16px 0; border-radius: 16px; overflow: hidden; background: #1c2024; flex: 0 0 auto; }
  .ad-close {
    position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%;
    background: rgba(0,0,0,0.5); color: #fff; border: none; font-size: 15px; cursor: pointer; z-index: 3;
  }
  .ad-headline { font-size: 20px; font-weight: 800; color: #fff; line-height: 1.2; }
  .ad-highlight { font-size: 15px; font-weight: 800; color: #D4A62A; line-height: 1.2; margin-top: 2px; }
  .ad-body { font-size: 13px; color: #d8d8d8; line-height: 1.4; }
  .ad-cta {
    display: inline-block; background: #7CC24A; color: #14171A; font-weight: 700; font-size: 13px;
    padding: 10px 18px; border-radius: 8px; text-decoration: none; letter-spacing: 0.5px; white-space: nowrap;
  }
  .ad-badge-new {
    position: absolute; top: 12px; left: 12px; background: #D4A62A; color: #14171A; font-weight: 800;
    font-size: 12px; padding: 5px 10px; border-radius: 5px; z-index: 2; letter-spacing: 0.5px;
  }
  .ad-badge-circle {
    position: absolute; top: 12px; right: 12px; width: 66px; height: 66px; border-radius: 50%;
    background: #D4A62A; color: #14171A; font-weight: 800; font-size: 10px; line-height: 1.15;
    display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px;
    z-index: 2; text-transform: uppercase;
  }

  /* Swipe-up-for-menu hint + drag behavior */
  .ad-swipe-hint {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 5px; padding: 5px 12px; border-radius: 20px;
    background: rgba(0,0,0,0.45); color: #fff; font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.3px; z-index: 2; pointer-events: none;
    animation: adSwipeBounce 1.8s ease-in-out infinite;
  }
  .ad-swipe-hint .chevron { font-size: 12px; line-height: 1; }
  @keyframes adSwipeBounce {
    0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.85; }
    50% { transform: translateX(-50%) translateY(-4px); opacity: 1; }
  }

  /* Template 3: side card — photo bleeding in from the right, text on the left */
  .ad-t3 { position: relative; min-height: 190px; }
  .ad-t3 .ad-image { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .ad-t3 .ad-gradient { position: absolute; inset: 0; background: linear-gradient(to right, #14171A 38%, rgba(20,23,26,0.05) 78%); }
  .ad-t3 .ad-content { position: relative; z-index: 1; padding: 20px; max-width: 66%; }
  .ad-t3 .ad-highlight { font-size: 21px; margin-top: 0; margin-bottom: 8px; }
  .ad-t3 .ad-headline { font-size: 21px; }
  .ad-t3 .ad-body { margin-bottom: 14px; }

  /* Template 1: hero photo on top, badges over it, dark text bar below with button on the right */
  .ad-t1-photo { position: relative; height: 170px; background-size: cover; background-position: center; }
  .ad-t1-bar { padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .ad-t1-text { flex: 1; min-width: 0; }
  .ad-t1-text .ad-highlight { margin-bottom: 6px; }
  .ad-t1-text .ad-body { margin-top: 6px; }

  /* Template 2: hero photo with headline overlaid directly on it, feature-icon row below */
  .ad-t2-photo { position: relative; height: 190px; background-size: cover; background-position: center; display: flex; align-items: flex-end; }
  .ad-t2-gradient { position: absolute; inset: 0; background: linear-gradient(to top, rgba(20,23,26,0.85) 0%, rgba(20,23,26,0.15) 55%, rgba(20,23,26,0) 100%); }
  .ad-t2-overlay-text { position: relative; z-index: 1; padding: 16px 18px; }
  .ad-t2-overlay-text .ad-highlight { font-size: 17px; margin-top: 4px; }
  .ad-t2-bar { padding: 14px 18px; display: flex; align-items: center; gap: 14px; }
  .ad-t2-features { flex: 1; display: flex; gap: 10px; min-width: 0; }
  .ad-feature { flex: 1; min-width: 0; text-align: center; }
  .ad-feature-icon { font-size: 18px; margin-bottom: 4px; }
  .ad-feature-text { font-size: 11px; color: #d8d8d8; line-height: 1.3; }
  .ad-feature-divider { width: 1px; background: #2a2e33; align-self: stretch; margin: 4px 0; }

  .tabs {
    display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; border-bottom: 1px solid #2a2e33;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 9px 14px;
    border-radius: 9px; background: #1c2024; border: 1px solid #2a2e33; cursor: pointer;
    font-size: 14px; font-weight: 600; color: #b8bcc2; white-space: nowrap;
  }
  .tab.active { color: #7CC24A; border-color: #7CC24A; background: #1c2620; }
  .icon-img { width: 18px; height: 18px; border-radius: 4px; background-size: cover; background-position: center; display: inline-block; }

  .menu-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 16px 24px; }
  .category-heading { font-size: 12px; letter-spacing: 2px; color: #D4A62A; font-weight: 700; margin: 4px 0 12px; text-transform: uppercase; }
  .item-card {
    background: #1c2024; border: 1px solid #2a2e33; border-radius: 12px; overflow: hidden;
    margin-bottom: 12px; display: flex; align-items: stretch; min-height: 84px;
  }
  .item-img {
    width: 96px; flex: 0 0 96px; background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
  }
  .item-body { flex: 1; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .item-name { font-size: 15px; font-weight: 700; }
  .item-desc { font-size: 12px; color: #8a8f96; margin-top: 3px; }
  .item-price { font-size: 15px; font-weight: 700; color: #7CC24A; white-space: nowrap; }
  .empty-note { text-align: center; color: #6b6f75; padding: 60px 20px; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>

  <!-- Checking network -->
  <div class="center-screen" id="checkingScreen">
    <div class="emoji">📶</div>
    <p>Checking connection…</p>
  </div>

  <!-- Blocked: not on the restaurant's WiFi -->
  <div class="center-screen" id="blockedScreen" style="display:none;">
    <div class="emoji">🔒</div>
    <h1>Connect to WiFi to view the menu</h1>
    <p>Our menu is only viewable while connected to the restaurant's WiFi network. Please join it and reload this page.</p>
  </div>

  <!-- Read-only menu -->
  <div class="screen" id="menuScreen" style="display:none;">
    <div class="order-header">
      <div>
        <div class="title" id="pageTitle">Our Menu</div>
        <div class="sub" id="pageSub">Order with your server or at the counter</div>
      </div>
      <button class="lang-toggle" id="langToggle" onclick="toggleLanguage()" style="display:none;"></button>
    </div>
    <div id="adBanner" style="display:none;"></div>
    <div class="tabs" id="tabs"></div>
    <div class="menu-list" id="menuList"></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const locationId = params.get("location");

  let menu = [];
  let categories = [];
  let activeCategory = null;
  let categoryIcons = {};

  const CATEGORY_KEYWORDS = [
    ["burger", "🍔"], ["sandwich", "🥪"], ["steak", "🥩"], ["beef", "🥩"],
    ["chicken", "🍗"], ["wing", "🍗"], ["mexican", "🌮"], ["taco", "🌮"], ["burrito", "🌯"],
    ["appetizer", "🍤"], ["starter", "🍤"], ["seafood", "🦐"], ["shrimp", "🦐"], ["fish", "🐟"],
    ["soup", "🍲"], ["salad", "🥗"], ["pizza", "🍕"], ["pasta", "🍝"], ["noodle", "🍜"],
    ["drink", "🥤"], ["beverage", "🥤"], ["coffee", "☕"], ["dessert", "🍰"], ["sweet", "🍰"],
    ["breakfast", "🍳"], ["egg", "🍳"], ["side", "🍟"], ["fries", "🍟"], ["bread", "🍞"],
    ["sushi", "🍣"], ["bbq", "🍖"], ["barbecue", "🍖"], ["vegan", "🥦"], ["vegetarian", "🥦"],
    ["kid", "🧒"],
  ];
  function guessIcon(category) {
    const c = (category || "").trim().toLowerCase();
    const hit = CATEGORY_KEYWORDS.find(([kw]) => c.includes(kw));
    return hit ? hit[1] : "🍽️";
  }
  function iconFor(category) {
    const custom = categoryIcons[category];
    if (custom) return /^https?:\/\//i.test(custom) ? { imageUrl: custom } : { emoji: custom };
    return { emoji: guessIcon(category) };
  }
  function iconHtml(category) {
    const icon = iconFor(category);
    return icon.imageUrl
      ? `<span class="icon-img" style="background-image:url('${icon.imageUrl}')"></span>`
      : `<span>${icon.emoji}</span>`;
  }

  // ---------------- Language toggle (EN/ES) ----------------
  let primaryLanguage = "en";
  let currentLang = "en";
  let categoryTranslations = {};
  const UI_STRINGS = {
    en: {
      pageTitle: "Our Menu", pageSub: "Order with your server or at the counter",
      comesWith: "Comes with", addExtra: "Add extra",
      noItems: "No menu items yet for this location.", couldNotLoad: "Could not load the menu. Please tell staff.",
      langButton: "Español",
    },
    es: {
      pageTitle: "Nuestro Menú", pageSub: "Ordena con tu mesero o en el mostrador",
      comesWith: "Incluye", addExtra: "Agregar extra",
      noItems: "Aún no hay artículos en el menú para esta ubicación.", couldNotLoad: "No se pudo cargar el menú. Por favor avisa al personal.",
      langButton: "English",
    },
  };
  function t(key) { return (UI_STRINGS[currentLang] || UI_STRINGS.en)[key]; }

  function toggleLanguage() {
    currentLang = currentLang === "en" ? "es" : "en";
    applyLanguageUI();
    renderTabs();
    renderMenu();
  }

  function applyLanguageUI() {
    const btn = document.getElementById("langToggle");
    btn.textContent = "🌐 " + t("langButton");
    btn.style.display = "inline-block";
    document.getElementById("pageTitle").textContent = t("pageTitle");
    document.getElementById("pageSub").textContent = t("pageSub");
  }

  function catLabel(cat) {
    if (currentLang === primaryLanguage) return cat;
    return categoryTranslations[cat] || cat;
  }

  async function loadCategoryTranslations() {
    try {
      const res = await fetch(`/api/category-translations/${encodeURIComponent(locationId)}`);
      if (res.ok) categoryTranslations = await res.json();
    } catch (err) {
      // keep original category names as fallback
    }
  }

  function itemText(item) {
    if (currentLang === primaryLanguage) return { name: item.name, description: item.description };
    return { name: item.nameAlt || item.name, description: item.descriptionAlt || item.description };
  }
  function modName(m) {
    if (currentLang === primaryLanguage) return m.name;
    return m.nameAlt || m.name;
  }

  // ---------------- Startup: network check ----------------
  if (!locationId) {
    document.getElementById("checkingScreen").style.display = "none";
    document.getElementById("blockedScreen").style.display = "flex";
    document.querySelector("#blockedScreen h1").textContent = "No location set";
    document.querySelector("#blockedScreen p").textContent = "This link is missing its location. Please ask staff for the correct QR code.";
  } else {
    checkNetwork();
  }

  async function checkNetwork() {
    try {
      const res = await fetch(`/api/table-order-check/${encodeURIComponent(locationId)}`);
      const data = await res.json();
      document.getElementById("checkingScreen").style.display = "none";
      if (!data.allowed) {
        document.getElementById("blockedScreen").style.display = "flex";
      } else {
        primaryLanguage = data.primaryLanguage || "en";
        currentLang = primaryLanguage;
        document.getElementById("menuScreen").style.display = "flex";
        applyLanguageUI();
        initAdSwipe();
        await loadCategoryIcons();
        await loadCategoryTranslations();
        await loadCategoryAds();
        await loadMenu();
      }
    } catch (err) {
      document.getElementById("checkingScreen").style.display = "none";
      document.getElementById("blockedScreen").style.display = "flex";
    }
  }

  async function loadCategoryIcons() {
    try {
      const res = await fetch(`/api/category-icons/${encodeURIComponent(locationId)}`);
      if (res.ok) categoryIcons = await res.json();
    } catch (err) {
      // keep keyword-guess icons
    }
  }

  // ---------------- Promo banner (per category) ----------------
  let categoryAds = {};
  let dismissedAdCategories = new Set();

  async function loadCategoryAds() {
    try {
      const res = await fetch(`/api/category-ads/${encodeURIComponent(locationId)}`);
      if (res.ok) categoryAds = await res.json();
    } catch (err) {
      categoryAds = {};
    }
  }

  function escapeHtml(s) {
    return (s || "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function renderAdBanner() {
    const banner = document.getElementById("adBanner");
    const ads = categoryAds[activeCategory];
    // Pick one at random each time the banner renders, so a category with
    // multiple ads configured rotates between them across views/tab switches.
    const ad = (ads && ads.length) ? ads[Math.floor(Math.random() * ads.length)] : null;
    if (!ad || dismissedAdCategories.has(activeCategory) || (!ad.headline && !ad.highlight && !ad.body)) {
      banner.style.display = "none";
      banner.innerHTML = "";
      return;
    }

    const headline = escapeHtml(ad.headline);
    const highlight = escapeHtml(ad.highlight);
    const body = escapeHtml(ad.body);
    const badgeHtml = ad.badgeText ? `<div class="ad-badge-new">${escapeHtml(ad.badgeText)}</div>` : "";
    const limitedHtml = ad.limitedText ? `<div class="ad-badge-circle">${escapeHtml(ad.limitedText)}</div>` : "";
    const ctaHtml = (ad.buttonText && ad.buttonLink)
      ? `<a href="${ad.buttonLink}" class="ad-cta" target="_blank" rel="noopener">${escapeHtml(ad.buttonText)}</a>`
      : "";
    const closeBtn = `<button class="ad-close" onclick="dismissAd()">✕</button>`;
    const photoStyle = ad.imageUrl ? `background-image:url('${ad.imageUrl}')` : "background:#22252A;";

    let html;
    if (ad.template === 1) {
      html = `
        <div class="ad-t1">
          ${closeBtn}
          <div class="ad-t1-photo" style="${photoStyle}">${badgeHtml}${limitedHtml}</div>
          <div class="ad-t1-bar">
            <div class="ad-t1-text">
              <div class="ad-headline">${headline}</div>
              <div class="ad-highlight">${highlight}</div>
              <div class="ad-body">${body}</div>
            </div>
            ${ctaHtml}
          </div>
        </div>`;
    } else if (ad.template === 2) {
      const features = (ad.features || []).filter((f) => f && (f.icon || f.text));
      const featuresHtml = features.length
        ? features.map((f) => `<div class="ad-feature"><div class="ad-feature-icon">${escapeHtml(f.icon)}</div><div class="ad-feature-text">${escapeHtml(f.text)}</div></div>`).join('<div class="ad-feature-divider"></div>')
        : `<div class="ad-body">${body}</div>`;
      html = `
        <div class="ad-t2">
          ${closeBtn}
          <div class="ad-t2-photo" style="${photoStyle}">
            <div class="ad-t2-gradient"></div>
            ${badgeHtml}${limitedHtml}
            <div class="ad-t2-overlay-text">
              <div class="ad-headline">${headline}</div>
              <div class="ad-highlight">${highlight}</div>
            </div>
          </div>
          <div class="ad-t2-bar">
            <div class="ad-t2-features">${featuresHtml}</div>
            ${ctaHtml}
          </div>
        </div>`;
    } else {
      html = `
        <div class="ad-t3">
          <div class="ad-image" style="${photoStyle}"></div>
          <div class="ad-gradient"></div>
          ${closeBtn}
          <div class="ad-content">
            <div class="ad-headline">${headline}</div>
            <div class="ad-highlight">${highlight}</div>
            <div class="ad-body">${body}</div>
            ${ctaHtml}
          </div>
        </div>`;
    }

    const swipeHint = `<div class="ad-swipe-hint"><span class="chevron">⌃</span>Swipe up for menu</div>`;

    banner.className = "ad-wrap";
    banner.innerHTML = html + swipeHint;
    banner.style.display = "block";
    banner.style.transform = "";
    banner.style.opacity = "";
  }

  function dismissAd() {
    dismissedAdCategories.add(activeCategory);
    document.getElementById("adBanner").style.display = "none";
  }

  // ---------------- Swipe up on the ad to reveal the full menu ----------------
  function initAdSwipe() {
    const banner = document.getElementById("adBanner");
    let startY = 0, currentY = 0, dragging = false;

    banner.addEventListener("touchstart", (e) => {
      if (banner.style.display === "none" || !e.touches.length) return;
      startY = currentY = e.touches[0].clientY;
      dragging = true;
      banner.style.transition = "none";
    }, { passive: true });

    banner.addEventListener("touchmove", (e) => {
      if (!dragging || !e.touches.length) return;
      currentY = e.touches[0].clientY;
      const dy = startY - currentY;
      if (dy > 0) {
        banner.style.transform = `translateY(${-dy}px)`;
        banner.style.opacity = String(Math.max(1 - dy / 160, 0.15));
      }
    }, { passive: true });

    banner.addEventListener("touchend", () => {
      if (!dragging) return;
      dragging = false;
      const dy = startY - currentY;
      banner.style.transition = "transform 0.22s ease, opacity 0.22s ease";
      if (dy > 50) {
        banner.style.transform = "translateY(-140%)";
        banner.style.opacity = "0";
        setTimeout(dismissAd, 200);
      } else {
        banner.style.transform = "translateY(0)";
        banner.style.opacity = "1";
      }
    });

    banner.addEventListener("touchcancel", () => {
      if (!dragging) return;
      dragging = false;
      banner.style.transition = "transform 0.22s ease, opacity 0.22s ease";
      banner.style.transform = "translateY(0)";
      banner.style.opacity = "1";
    });
  }

  // ---------------- Menu ----------------
  async function loadMenu() {
    try {
      const res = await fetch(`/api/menu/${encodeURIComponent(locationId)}`);
      menu = await res.json();
      categories = [...new Set(menu.map((m) => m.category || "Menu"))];
      activeCategory = categories[0] || null;
      renderTabs();
      renderMenu();
      renderAdBanner();
    } catch (err) {
      document.getElementById("menuList").innerHTML = `<div class="empty-note">${t("couldNotLoad")}</div>`;
    }
  }

  function renderTabs() {
    const tabsEl = document.getElementById("tabs");
    if (!categories.length) { tabsEl.innerHTML = ""; return; }
    tabsEl.innerHTML = categories.map((cat) => `
      <div class="tab ${cat === activeCategory ? "active" : ""}" data-cat="${cat}">${iconHtml(cat)}<span>${catLabel(cat)}</span></div>
    `).join("");
    tabsEl.querySelectorAll(".tab").forEach((tab) => {
      tab.addEventListener("click", () => { activeCategory = tab.dataset.cat; renderTabs(); renderMenu(); renderAdBanner(); });
    });
  }

  function splitModifiers(mods) {
    const included = [];
    const addons = [];
    (mods || []).forEach((m) => {
      if (typeof m === "string") addons.push({ name: m, nameAlt: null });
      else if (m && m.type === "included") included.push({ name: m.name, nameAlt: m.nameAlt });
      else if (m && m.name) addons.push({ name: m.name, nameAlt: m.nameAlt });
    });
    return { included, addons };
  }

  function renderMenu() {
    const listEl = document.getElementById("menuList");
    if (!menu.length) {
      listEl.innerHTML = `<div class="empty-note">${t("noItems")}</div>`;
      return;
    }
    const items = menu.filter((m) => (m.category || "Menu") === activeCategory);
    listEl.innerHTML = `
      <div class="category-heading">${catLabel(activeCategory)}</div>
      ${items.map((item) => {
        const icon = iconFor(item.category);
        const imgStyle = item.imageUrl
          ? `background-image:url('${item.imageUrl}')`
          : icon.imageUrl ? `background-image:url('${icon.imageUrl}')` : "background:#22252A;";
        const { name, description } = itemText(item);
        const { included, addons } = splitModifiers(item.modifiers);
        const modsLines = [
          included.length ? `<div><b>${t("comesWith")}:</b> ${included.map(modName).join(", ")}</div>` : "",
          addons.length ? `<div><b>${t("addExtra")}:</b> ${addons.map(modName).join(", ")}</div>` : "",
        ].filter(Boolean).join("");
        return `
        <div class="item-card">
          <div class="item-img" style="${imgStyle}">${(item.imageUrl || icon.imageUrl) ? "" : icon.emoji}</div>
          <div class="item-body">
            <div>
              <div class="item-name">${name}</div>
              ${description ? `<div class="item-desc">${description}</div>` : ""}
              ${modsLines ? `<div class="item-desc" style="margin-top:6px; line-height:1.5;">${modsLines}</div>` : ""}
            </div>
            ${item.price != null ? `<div class="item-price">$${Number(item.price).toFixed(2)}</div>` : ""}
          </div>
        </div>`;
      }).join("")}
    `;
  }
</script>
</body>
</html>
