<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Kitchen Display</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #14171A;
    background-image: radial-gradient(circle at 20% 10%, rgba(255,255,255,0.03), transparent 40%);
    padding: 20px 28px;
    font-family: 'JetBrains Mono', monospace;
    color: #EDEAE2;
  }

  /* header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
    padding-bottom: 16px;
    border-bottom: 1px solid #2a2e33;
  }
  .header .title { font-weight: 700; font-size: 18px; letter-spacing: 1px; }
  .header .right { display: flex; align-items: center; gap: 18px; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .status-text { color: #7a7e84; font-size: 11px; letter-spacing: 1px; }
  .oldest-fire { color: #7a7e84; font-size: 12px; }
  .test-btn {
    background: #22252A; color: #EDEAE2; border: 1px solid #3a3e44;
    border-radius: 3px; padding: 8px 12px; font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .sound-btn {
    background: #22252A; color: #EDEAE2; border: 1px solid #3a3e44;
    border-radius: 3px; padding: 8px 12px; font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: inherit;
  }
  .sound-btn.enabled { border-color: #5B8C5A; color: #5B8C5A; }

  /* columns */
  .board { display: flex; gap: 28px; align-items: flex-start; }
  .column { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .col-head {
    display: flex; align-items: center; gap: 8px; padding: 10px 4px;
    border-bottom: 2px solid; margin-bottom: 18px;
  }
  .col-head .label { font-weight: 700; font-size: 13px; letter-spacing: 2px; }
  .col-head .count { margin-left: auto; font-size: 12px; font-weight: 700; }
  .col-body { display: flex; flex-direction: column; gap: 26px; }
  .empty { font-size: 12px; color: #4a4d52; padding: 8px 4px; }

  /* ticket */
  .ticket {
    background: #FAF8F3; border-radius: 2px; width: 100%; position: relative;
    box-shadow: 0 6px 14px rgba(0,0,0,0.45); transform: rotate(-0.3deg);
  }
  .ticket .clip {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 38px; height: 16px; background: linear-gradient(180deg,#8a8f96,#5c6066);
    border-radius: 3px; box-shadow: 0 2px 3px rgba(0,0,0,0.5);
  }
  .ticket-body { padding: 14px 14px 10px; }
  .ticket-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .ticket-num { font-weight: 700; font-size: 20px; color: #22252A; letter-spacing: 0.5px; flex-shrink: 0; }
  .ticket-phone { font-size: 11px; color: #7a8a99; font-weight: 600; text-align: center; flex: 1; }
  .ticket-cust { font-weight: 700; font-size: 12px; color: #5c6066; text-align: right; flex-shrink: 0; }
  .ticket-meta { font-size: 10px; color: #3B5BA5; font-weight: 700; letter-spacing: 0.5px; margin-top: 3px; }
  .divider { border-top: 1.5px dashed #c9c2b0; margin: 10px 0; }
  .items { display: flex; flex-direction: column; gap: 6px; }
  .item-row { display: flex; align-items: flex-start; gap: 6px; }
  .item-dot { width: 6px; height: 6px; border-radius: 50%; background: #7a7e84; flex-shrink: 0; margin-top: 6px; }
  .item-name { font-size: 13px; color: #22252A; line-height: 1.3; }
  .item-mods { font-size: 11px; color: #6b6f75; margin-top: 2px; }
  .ticket-note { margin-top: 8px; font-size: 12px; color: #a5502f; font-style: italic; }
  .timer-row { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; }
  .timer { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .advance-btn {
    color: #FAF8F3; border: none; border-radius: 3px; padding: 6px 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer;
    font-family: inherit;
  }
  .fuse-track { height: 3px; background: #e5e0d3; border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .fuse-fill { height: 100%; transition: width 1s linear; }
  .ack-btn {
    background: none; border: 1.5px solid #C4462B; color: #C4462B;
    border-radius: 3px; padding: 5px 9px; font-size: 10px; font-weight: 700;
    letter-spacing: 0.5px; cursor: pointer; font-family: inherit; margin-top: 8px;
    width: 100%;
  }
  .ticket.unacked { animation: pulse-border 1.4s ease-in-out infinite; }
  @keyframes pulse-border {
    0%, 100% { box-shadow: 0 6px 14px rgba(0,0,0,0.45), 0 0 0 0 rgba(196,70,43,0.6); }
    50% { box-shadow: 0 6px 14px rgba(0,0,0,0.45), 0 0 0 4px rgba(196,70,43,0); }
  }
</style>
</head>
<body>
  <div class="header">
    <div class="title" id="title">LINE — <span id="locationLabel">unassigned</span></div>
    <div class="right">
      <div style="display:flex;align-items:center;gap:6px;">
        <span class="status-dot" id="statusDot" style="background:#C4462B;"></span>
        <span class="status-text" id="statusText">DISCONNECTED</span>
      </div>
      <div class="oldest-fire" id="oldestFire">oldest fire: —</div>
      <button class="sound-btn" id="soundBtn">🔔 ENABLE SOUND</button>
      <button class="test-btn" id="testBtn">+ TEST TICKET</button>
    </div>
  </div>

  <div class="board">
    <div class="column">
      <div class="col-head" style="border-color:#D4A62A;">
        <span class="label">NEW</span><span class="count" style="color:#D4A62A;" id="countNew">0</span>
      </div>
      <div class="col-body" id="colNew"></div>
    </div>
    <div class="column">
      <div class="col-head" style="border-color:#C4462B;">
        <span class="label">COOKING</span><span class="count" style="color:#C4462B;" id="countCooking">0</span>
      </div>
      <div class="col-body" id="colCooking"></div>
    </div>
    <div class="column">
      <div class="col-head" style="border-color:#4A7A6C;">
        <span class="label">READY</span><span class="count" style="color:#4A7A6C;" id="countReady">0</span>
      </div>
      <div class="col-body" id="colReady"></div>
    </div>
  </div>

<script>
  // ---- location / connection setup ------------------------------------
  const params = new URLSearchParams(location.search);
  const watchLocation = params.get("location") || "unassigned";
  document.getElementById("locationLabel").textContent = watchLocation;

  let tickets = []; // { id, ticketNumber, customer, items, notes, placedAt, fulfillmentMethod, readyTime, status, acked, chimeTimer }
  let testSeq = 900;

  // ---- sound: synthesized doorbell chime, no audio file needed ----------
  let audioCtx = null;
  let soundEnabled = false;
  const soundBtn = document.getElementById("soundBtn");

  soundBtn.addEventListener("click", () => {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioCtx.resume();
    soundEnabled = true;
    soundBtn.textContent = "🔔 SOUND ON";
    soundBtn.classList.add("enabled");
    playChime(); // confirmation blip so the cook knows it's working
  });

  function playChime() {
    if (!soundEnabled || !audioCtx) return;
    const now = audioCtx.currentTime;
    // simple two-note "ding-dong" doorbell using two short oscillator tones
    [ { freq: 880, start: 0 }, { freq: 659, start: 0.22 } ].forEach(({ freq, start }) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, now + start);
      gain.gain.linearRampToValueAtTime(0.35, now + start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + start + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + start);
      osc.stop(now + start + 0.55);
    });
  }

  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");

  function setConnected(isConnected) {
    statusDot.style.background = isConnected ? "#5B8C5A" : "#C4462B";
    statusText.textContent = isConnected ? "LIVE — WIX" : "DISCONNECTED";
  }

  function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws = new WebSocket(`${proto}://${location.host}/kds-stream?location=${encodeURIComponent(watchLocation)}`);
    ws.onopen = () => setConnected(true);
    ws.onclose = () => { setConnected(false); setTimeout(connect, 2000); };
    ws.onerror = () => setConnected(false);
    ws.onmessage = (event) => {
      const msg = JSON.parse(event.data);
      if (msg.type === "new_order") addTicket(msg.order);
    };
  }
  connect();

  function addTicket(order) {
    const ticket = {
      id: order.id,
      ticketNumber: order.ticketNumber || order.id,
      customer: order.customer,
      customerPhone: order.customerPhone || null,
      items: order.items || [],
      notes: order.notes,
      fulfillmentMethod: order.fulfillmentMethod,
      readyTime: order.readyTime,
      firedAt: order.placedAt ? new Date(order.placedAt).getTime() : Date.now(),
      status: "new",
      acked: false,
      chimeTimer: null,
    };
    tickets.push(ticket);
    playChime();
    ticket.chimeTimer = setInterval(() => {
      if (!ticket.acked) playChime();
    }, 12000);
    render();
  }

  function acknowledge(id) {
    const t = tickets.find((x) => x.id === id);
    if (!t) return;
    t.acked = true;
    if (t.chimeTimer) clearInterval(t.chimeTimer);
    render();
  }

  function clearChime(t) {
    if (t.chimeTimer) clearInterval(t.chimeTimer);
  }

  document.getElementById("testBtn").addEventListener("click", () => {
    testSeq++;
    addTicket({
      id: "test-" + testSeq,
      ticketNumber: testSeq,
      customer: "Test Order",
      customerPhone: "(806) 778-1696",
      items: [
        { name: "Sample Item A", quantity: 2, modifiers: ["no onions"] },
        { name: "Sample Item B", quantity: 1, modifiers: [] },
      ],
      fulfillmentMethod: "Pickup",
      placedAt: new Date().toISOString(),
    });
  });

  function advance(id) {
    const t = tickets.find((x) => x.id === id);
    if (!t) return;
    if (t.status === "new") { t.status = "cooking"; clearChime(t); }
    else if (t.status === "cooking") t.status = "ready";
    else { clearChime(t); tickets = tickets.filter((x) => x.id !== id); } // bump / clear
    render();
  }

  function elapsedLabel(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    const rem = s % 60;
    return `${m}:${rem.toString().padStart(2, "0")}`;
  }

  function urgency(ms) {
    const s = ms / 1000;
    if (s < 240) return { color: "#5B8C5A", pct: Math.min(s / 240, 1) };
    if (s < 480) return { color: "#D4A62A", pct: Math.min((s - 240) / 240, 1) };
    return { color: "#C4462B", pct: 1 };
  }

  function ticketNode(t, now) {
    const elapsed = now - t.firedAt;
    const { color: fuseColor, pct } = urgency(elapsed);
    const meta = [t.fulfillmentMethod, t.readyTime ? `ready ${t.readyTime}` : null].filter(Boolean).join(" · ");
    const buttonLabel = t.status === "new" ? "FIRE →" : t.status === "cooking" ? "READY →" : "BUMP ✓";
    const buttonColor = t.status === "ready" ? "#3B5BA5" : "#22252A";
    const showAck = t.status === "new" && !t.acked;

    const el = document.createElement("div");
    el.className = "ticket" + (showAck ? " unacked" : "");
    el.innerHTML = `
      <div class="clip"></div>
      <div class="ticket-body">
        <div class="ticket-head">
          <span class="ticket-num">#${t.ticketNumber}</span>
          ${t.customerPhone ? `<span class="ticket-phone">${t.customerPhone}</span>` : ""}
          <span class="ticket-cust">${t.customer || ""}</span>
        </div>
        ${meta ? `<div class="ticket-meta">${meta}</div>` : ""}
        <div class="divider"></div>
        <div class="items">
          ${t.items.map(i => `
            <div class="item-row">
              <span class="item-dot"></span>
              <div>
                <div class="item-name">${i.quantity}× ${i.name}</div>
                ${i.modifiers && i.modifiers.length ? `<div class="item-mods">${i.modifiers.join(", ")}</div>` : ""}
              </div>
            </div>
          `).join("")}
        </div>
        ${t.notes ? `<div class="ticket-note">Note: ${t.notes}</div>` : ""}
        <div class="timer-row">
          <span class="timer" style="color:${fuseColor}">${elapsedLabel(elapsed)}</span>
          <button class="advance-btn" style="background:${buttonColor}">${buttonLabel}</button>
        </div>
        <div class="fuse-track"><div class="fuse-fill" style="width:${pct * 100}%;background:${fuseColor}"></div></div>
        ${showAck ? `<button class="ack-btn">✓ SEEN — SILENCE</button>` : ""}
      </div>
    `;
    el.querySelector(".advance-btn").addEventListener("click", () => advance(t.id));
    const ackBtn = el.querySelector(".ack-btn");
    if (ackBtn) ackBtn.addEventListener("click", () => acknowledge(t.id));
    return el;
  }

  function render() {
    const now = Date.now();
    const cols = { new: document.getElementById("colNew"), cooking: document.getElementById("colCooking"), ready: document.getElementById("colReady") };
    Object.values(cols).forEach((c) => (c.innerHTML = ""));

    ["new", "cooking", "ready"].forEach((status) => {
      const list = tickets.filter((t) => t.status === status).sort((a, b) => a.firedAt - b.firedAt);
      const col = cols[status];
      if (list.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "— clear —";
        col.appendChild(empty);
      } else {
        list.forEach((t) => col.appendChild(ticketNode(t, now)));
      }
    });

    document.getElementById("countNew").textContent = tickets.filter((t) => t.status === "new").length;
    document.getElementById("countCooking").textContent = tickets.filter((t) => t.status === "cooking").length;
    document.getElementById("countReady").textContent = tickets.filter((t) => t.status === "ready").length;

    const newTickets = tickets.filter((t) => t.status === "new");
    const oldestFireEl = document.getElementById("oldestFire");
    if (newTickets.length) {
      const oldestAge = now - Math.min(...newTickets.map((t) => t.firedAt));
      oldestFireEl.textContent = `oldest fire: ${elapsedLabel(oldestAge)}`;
    } else {
      oldestFireEl.textContent = "oldest fire: —";
    }
  }

  // re-render every second so timers/fuse bars tick even with no new orders
  setInterval(render, 1000);
  render();
</script>
</body>
</html>
