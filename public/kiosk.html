<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Order Here</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; background: #14171A; color: #EDEAE2;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column;
  }
  .header {
    padding: 20px 24px; border-bottom: 1px solid #2a2e33;
    display: flex; justify-content: space-between; align-items: center;
  }
  .header h1 { margin: 0; font-size: 22px; }
  .cart-pill {
    background: #C4462B; color: #fff; padding: 10px 18px; border-radius: 24px;
    font-weight: 700; font-size: 15px; border: none; cursor: pointer;
  }
  .layout { flex: 1; display: flex; overflow: hidden; }
  .menu-col { flex: 2; overflow-y: auto; padding: 20px; }
  .cart-col {
    flex: 1; min-width: 320px; max-width: 380px; background: #1c2024;
    border-left: 1px solid #2a2e33; padding: 20px; display: flex; flex-direction: column;
  }
  .category { font-size: 13px; letter-spacing: 2px; color: #D4A62A; font-weight: 700; margin: 24px 0 10px; }
  .category:first-child { margin-top: 0; }
  .item-card {
    background: #1c2024; border: 1px solid #2a2e33; border-radius: 10px;
    padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
  }
  .item-card:active { background: #262b30; }
  .item-name { font-size: 17px; font-weight: 600; }
  .item-desc { font-size: 13px; color: #8a8f96; margin-top: 4px; }
  .item-price { font-size: 17px; font-weight: 700; color: #5B8C5A; white-space: nowrap; margin-left: 12px; }

  .cart-line { padding: 12px 0; border-bottom: 1px solid #2a2e33; }
  .cart-line-top { display: flex; justify-content: space-between; align-items: baseline; }
  .cart-line-name { font-weight: 600; font-size: 15px; }
  .cart-line-price { font-size: 14px; color: #8a8f96; }
  .cart-line-mods { font-size: 12px; color: #7a8a99; margin-top: 3px; }
  .qty-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .qty-btn {
    width: 30px; height: 30px; border-radius: 6px; border: 1px solid #3a3e44;
    background: #22252A; color: #EDEAE2; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  .cart-total { margin-top: auto; padding-top: 16px; border-top: 2px solid #2a2e33; }
  .cart-total-row { display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-bottom: 16px; }
  .place-order-btn {
    width: 100%; padding: 18px; font-size: 18px; font-weight: 700; border: none;
    border-radius: 10px; background: #5B8C5A; color: #fff; cursor: pointer;
  }
  .place-order-btn:disabled { background: #3a3e44; color: #6b6f75; cursor: not-allowed; }
  .empty-cart { color: #6b6f75; font-size: 14px; text-align: center; padding: 30px 0; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none;
    align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #1c2024; border-radius: 14px; padding: 26px; width: 90%; max-width: 420px;
    border: 1px solid #2a2e33;
  }
  .modal h2 { margin-top: 0; }
  .mod-option { display: flex; align-items: center; gap: 10px; padding: 10px 0; font-size: 15px; border-bottom: 1px solid #2a2e33; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .modal-actions button { flex: 1; padding: 14px; border-radius: 8px; border: none; font-weight: 700; font-size: 15px; cursor: pointer; }
  .add-btn { background: #5B8C5A; color: #fff; }
  .cancel-btn { background: #3a3e44; color: #EDEAE2; }

  .confirm-overlay {
    position: fixed; inset: 0; background: #14171A; display: none;
    flex-direction: column; align-items: center; justify-content: center; z-index: 200; text-align: center;
  }
  .confirm-overlay.show { display: flex; }
  .confirm-overlay .big { font-size: 52px; font-weight: 700; color: #5B8C5A; margin-bottom: 10px; }
  .confirm-overlay .msg { font-size: 20px; color: #EDEAE2; margin-bottom: 6px; }
  .confirm-overlay .sub { font-size: 15px; color: #8a8f96; }
</style>
</head>
<body>
  <div class="header">
    <h1>Order Here</h1>
    <button class="cart-pill" id="cartPill" onclick="scrollToCart()">Cart: 0</button>
  </div>

  <div class="layout">
    <div class="menu-col" id="menuCol">
      <div class="empty-cart">Loading menu…</div>
    </div>
    <div class="cart-col" id="cartCol">
      <h2 style="margin-top:0;">Your Order</h2>
      <div id="cartLines"><div class="empty-cart">Your cart is empty.<br/>Tap items to add them.</div></div>
      <div class="cart-total">
        <div class="cart-total-row"><span>Total</span><span id="cartTotal">$0.00</span></div>
        <button class="place-order-btn" id="placeOrderBtn" disabled onclick="placeOrder()">Place Order</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalItemName"></h2>
      <div id="modalMods"></div>
      <div class="qty-row" style="margin-top:16px;">
        <span>Quantity:</span>
        <button class="qty-btn" onclick="changeModalQty(-1)">-</button>
        <span id="modalQty">1</span>
        <button class="qty-btn" onclick="changeModalQty(1)">+</button>
      </div>
      <div class="modal-actions">
        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
        <button class="add-btn" onclick="addToCart()">Add to Order</button>
      </div>
    </div>
  </div>

  <div class="confirm-overlay" id="confirmOverlay">
    <div class="big" id="confirmTicket">#</div>
    <div class="msg">Order placed!</div>
    <div class="sub">Please pay at the counter. We'll call your number when it's ready.</div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const locationId = params.get("location");
  let menu = [];
  let cart = []; // { itemId, name, price, quantity, modifiers: [selected], selectedModifiersList }
  let modalItem = null;
  let modalQty = 1;
  let modalSelectedMods = [];

  if (!locationId) {
    document.getElementById("menuCol").innerHTML =
      '<div class="empty-cart">No location set. Open this page with ?location=&lt;id&gt; in the URL.</div>';
  } else {
    loadMenu();
  }

  async function loadMenu() {
    try {
      const res = await fetch(`/api/menu/${encodeURIComponent(locationId)}`);
      menu = await res.json();
      renderMenu();
    } catch (err) {
      document.getElementById("menuCol").innerHTML = '<div class="empty-cart">Could not load the menu. Please tell a staff member.</div>';
    }
  }

  function renderMenu() {
    const col = document.getElementById("menuCol");
    if (!menu.length) {
      col.innerHTML = '<div class="empty-cart">No menu items yet for this location.</div>';
      return;
    }
    const byCategory = {};
    menu.forEach((item) => {
      const cat = item.category || "Menu";
      (byCategory[cat] = byCategory[cat] || []).push(item);
    });
    col.innerHTML = Object.entries(byCategory)
      .map(
        ([cat, items]) => `
        <div class="category">${cat}</div>
        ${items
          .map(
            (item) => `
          <div class="item-card" data-id="${item.id}">
            <div>
              <div class="item-name">${item.name}</div>
              ${item.description ? `<div class="item-desc">${item.description}</div>` : ""}
            </div>
            ${item.price != null ? `<div class="item-price">$${Number(item.price).toFixed(2)}</div>` : ""}
          </div>
        `
          )
          .join("")}
      `
      )
      .join("");
    col.querySelectorAll(".item-card").forEach((card) => {
      card.addEventListener("click", () => openModal(Number(card.dataset.id)));
    });
  }

  function openModal(itemId) {
    modalItem = menu.find((m) => m.id === itemId);
    if (!modalItem) return;
    modalQty = 1;
    modalSelectedMods = [];
    document.getElementById("modalItemName").textContent = modalItem.name;
    document.getElementById("modalQty").textContent = modalQty;
    const modsEl = document.getElementById("modalMods");
    const mods = modalItem.modifiers || [];
    modsEl.innerHTML = mods.length
      ? mods
          .map(
            (m, i) => `
        <label class="mod-option">
          <input type="checkbox" data-mod="${m}" onchange="toggleMod('${m.replace(/'/g, "\\'")}', this.checked)" />
          ${m}
        </label>
      `
          )
          .join("")
      : "";
    document.getElementById("modalOverlay").classList.add("show");
  }

  function toggleMod(mod, checked) {
    if (checked) modalSelectedMods.push(mod);
    else modalSelectedMods = modalSelectedMods.filter((m) => m !== mod);
  }

  function changeModalQty(delta) {
    modalQty = Math.max(1, modalQty + delta);
    document.getElementById("modalQty").textContent = modalQty;
  }

  function closeModal() {
    document.getElementById("modalOverlay").classList.remove("show");
  }

  function addToCart() {
    cart.push({
      itemId: modalItem.id,
      name: modalItem.name,
      price: modalItem.price,
      quantity: modalQty,
      modifiers: [...modalSelectedMods],
    });
    closeModal();
    renderCart();
  }

  function removeCartLine(index) {
    cart.splice(index, 1);
    renderCart();
  }

  function renderCart() {
    const linesEl = document.getElementById("cartLines");
    document.getElementById("cartPill").textContent = `Cart: ${cart.reduce((n, l) => n + l.quantity, 0)}`;
    if (!cart.length) {
      linesEl.innerHTML = '<div class="empty-cart">Your cart is empty.<br/>Tap items to add them.</div>';
      document.getElementById("cartTotal").textContent = "$0.00";
      document.getElementById("placeOrderBtn").disabled = true;
      return;
    }
    let total = 0;
    linesEl.innerHTML = cart
      .map((line, i) => {
        const lineTotal = (line.price || 0) * line.quantity;
        total += lineTotal;
        return `
        <div class="cart-line">
          <div class="cart-line-top">
            <span class="cart-line-name">${line.quantity}× ${line.name}</span>
            ${line.price != null ? `<span class="cart-line-price">$${lineTotal.toFixed(2)}</span>` : ""}
          </div>
          ${line.modifiers.length ? `<div class="cart-line-mods">${line.modifiers.join(", ")}</div>` : ""}
          <div class="qty-row">
            <button class="qty-btn" onclick="removeCartLine(${i})">✕ Remove</button>
          </div>
        </div>
      `;
      })
      .join("");
    document.getElementById("cartTotal").textContent = `$${total.toFixed(2)}`;
    document.getElementById("placeOrderBtn").disabled = false;
  }

  function scrollToCart() {
    document.getElementById("cartCol").scrollIntoView({ behavior: "smooth" });
  }

  async function placeOrder() {
    document.getElementById("placeOrderBtn").disabled = true;
    document.getElementById("placeOrderBtn").textContent = "Placing order…";
    try {
      const res = await fetch("/api/kiosk-order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          locationId,
          items: cart.map((l) => ({ itemId: l.itemId, quantity: l.quantity, selectedModifiers: l.modifiers })),
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Order failed");
      showConfirmation(data.ticketNumber);
      cart = [];
      renderCart();
    } catch (err) {
      alert("Sorry, something went wrong placing your order. Please tell a staff member.");
    } finally {
      document.getElementById("placeOrderBtn").disabled = false;
      document.getElementById("placeOrderBtn").textContent = "Place Order";
    }
  }

  function showConfirmation(ticketNumber) {
    document.getElementById("confirmTicket").textContent = "#" + ticketNumber;
    document.getElementById("confirmOverlay").classList.add("show");
    setTimeout(() => {
      document.getElementById("confirmOverlay").classList.remove("show");
    }, 8000);
  }
</script>
</body>
</html>
