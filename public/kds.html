<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>KDS Test Display</title>
<style>
  body { background:#111; color:#eee; font-family: -apple-system, Arial, sans-serif; margin:0; padding:24px; }
  h1 { font-size: 20px; color: #888; font-weight: 500; }
  #status { font-size: 13px; margin-bottom: 20px; }
  .connected { color: #4caf50; }
  .disconnected { color: #f44336; }
  #board { display: flex; flex-wrap: wrap; gap: 16px; }
  .ticket { background:#1e1e1e; border:2px solid #333; border-radius:10px; padding:16px; width:280px; }
  .ticket h2 { margin:0 0 8px; font-size:16px; color:#ffb74d; }
  .ticket .time { font-size:12px; color:#888; margin-bottom:10px; }
  .ticket ul { margin:0; padding-left:18px; }
  .ticket li { margin-bottom:6px; font-size:15px; }
  .mods { font-size:12px; color:#aaa; }
  .notes { margin-top:10px; font-size:13px; color:#ffab91; font-style:italic; }
</style>
</head>
<body>
  <h1 id="title">Kitchen Display — test view</h1>
  <div id="status" class="disconnected">connecting...</div>
  <div id="board"></div>

<script>
  const statusEl = document.getElementById("status");
  const titleEl = document.getElementById("title");
  const board = document.getElementById("board");
  const proto = location.protocol === "https:" ? "wss" : "ws";

  // Pass ?location=<id> in this page's URL to pin the screen to one
  // restaurant location, e.g. kds.html?location=downtown
  // Use ?location=all to see orders from every location on one screen.
  const params = new URLSearchParams(location.search);
  const watchLocation = params.get("location") || "unassigned";
  titleEl.textContent = `Kitchen Display — ${watchLocation}`;

  const ws = new WebSocket(`${proto}://${location.host}/kds-stream?location=${encodeURIComponent(watchLocation)}`);

  ws.onopen = () => {
    statusEl.textContent = `connected — watching "${watchLocation}" — waiting for orders`;
    statusEl.className = "connected";
  };
  ws.onclose = () => {
    statusEl.textContent = "disconnected";
    statusEl.className = "disconnected";
  };

  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === "new_order") renderTicket(msg.order);
  };

  function renderTicket(order) {
    const ticket = document.createElement("div");
    ticket.className = "ticket";
    const time = new Date(order.placedAt).toLocaleTimeString();
    const displayNumber = order.ticketNumber || order.id;
    const meta = [order.fulfillmentMethod, order.readyTime ? `ready ${order.readyTime}` : null]
      .filter(Boolean)
      .join(" · ");
    ticket.innerHTML = `
      <h2>Order #${displayNumber}${order.customer ? " — " + order.customer : ""}</h2>
      <div class="time">${time}${meta ? " · " + meta : ""}</div>
      <ul>
        ${order.items.map(i => `
          <li>${i.quantity}× ${i.name}
            ${i.modifiers.length ? `<div class="mods">${i.modifiers.join(", ")}</div>` : ""}
          </li>`).join("")}
      </ul>
      ${order.notes ? `<div class="notes">Note: ${order.notes}</div>` : ""}
    `;
    board.prepend(ticket);
  }
</script>
</body>
</html>
